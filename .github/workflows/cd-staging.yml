name: Deploy to Staging

on:
  push:
    branches: [ staging ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
      
      - name: Terraform Init
        working-directory: infrastructure/envs/staging
        run: terraform init
      
      - name: Terraform Plan
        working-directory: infrastructure/envs/staging
        run: terraform plan -out=tfplan
      
      - name: Terraform Apply
        working-directory: infrastructure/envs/staging
        run: terraform apply -auto-approve tfplan
      
      - name: Build and push Docker images
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            aegisai/data-generator:staging-${{ github.sha }}
            aegisai/ingestion-service:staging-${{ github.sha }}
            aegisai/ml-service:staging-${{ github.sha }}
            aegisai/alert-service:staging-${{ github.sha }}
            aegisai/api-gateway:staging-${{ github.sha }}
      
      - name: Deploy to EKS
        uses: aws-actions/amazon-eks-deploy@v1
        with:
          cluster-name: aegisai-eks-staging
          namespace: aegisai-staging
          manifests: k8s/overlays/staging
