name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [data-generator, ingestion-service, ml-service, alert-service, api-gateway]
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      
      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: |
          go mod download
          go test -v ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [data-generator, ingestion-service, ml-service, alert-service, api-gateway]
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker image
        working-directory: services/${{ matrix.service }}
        run: |
          docker build -t aegisai/${{ matrix.service }}:latest -f Dockerfile .
