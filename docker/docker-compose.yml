version: '3.8'

services:
  # Local Kafka for development
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # Data Generator Service
  data-generator:
    build:
      context: ..
      dockerfile: services/data-generator/Dockerfile
    environment:
      - KAFKA_BROKERS=kafka:9092
      - ENVIRONMENT=local
    depends_on:
      - kafka
    ports:
      - "8080:8080"

  # Ingestion Service
  ingestion-service:
    build:
      context: ..
      dockerfile: services/ingestion-service/Dockerfile
    environment:
      - KAFKA_BROKERS=kafka:9092
      - ENVIRONMENT=local
    depends_on:
      - kafka
    ports:
      - "8081:8080"

  # ML Service
  ml-service:
    build:
      context: ..
      dockerfile: services/ml-service/Dockerfile
    environment:
      - ENVIRONMENT=local
      - GRPC_PORT=9090
    ports:
      - "8082:8080"
      - "9090:9090"

  # Alert Service
  alert-service:
    build:
      context: ..
      dockerfile: services/alert-service/Dockerfile
    environment:
      - ENVIRONMENT=local
    ports:
      - "8083:8080"

  # API Gateway
  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    environment:
      - ENVIRONMENT=local
      - ML_SERVICE_ADDR=ml-service:9090
    depends_on:
      - ml-service
    ports:
      - "8084:8080"
      - "9091:9090"
