apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/data-generator
  - ../../base/ingestion-service
  - ../../base/ml-service
  - ../../base/alert-service
  - ../../base/api-gateway

namespace: aegisai-prod

commonLabels:
  environment: prod

patchesStrategicMerge:
  - patches/replicas.yaml
  - patches/resources.yaml
